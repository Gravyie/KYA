[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read-write", path = "../deployments" },
]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
galileo = "${OG_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
